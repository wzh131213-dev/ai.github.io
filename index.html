<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浏览器本地 AI · 多引擎多模型</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#d9dde3;--ac:#2563eb;--ok:#16a34a;--er:#dc2626;--u:#e8effe;--a:#f1f3f5}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#171a21;--tx:#e8eaee;--mu:#98a2b3;--bd:#2a2f3a;--ac:#5b8cff;--u:#1d2a4a;--a:#20242d}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:1280px;padding:14px;display:flex;flex-direction:column;gap:10px;height:100%}
h1{font-size:18px;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{font-size:12px;color:var(--mu)}
select,input,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
select,input{min-width:0}.grow{flex:1 1 200px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#st{white-space:pre-wrap;font-size:12px;color:var(--mu);margin-top:6px;word-break:break-all}.ok{color:var(--ok)!important}.er{color:var(--er)!important}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px}
.m{padding:8px 12px;border-radius:10px;white-space:pre-wrap;word-break:break-word;max-width:92%}
.m.user{background:var(--u);align-self:flex-end}.m.assistant{background:var(--a);align-self:flex-start}
.tw{flex:1 1 180px;min-height:140px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;background:var(--card);text-align:left;color:var(--mu);font-weight:500}
th,td{padding:6px 10px;border-bottom:1px solid var(--bd)}tbody tr{cursor:pointer}tbody tr:hover{background:var(--a)}tbody tr.sel{background:var(--u);font-weight:600}
#in{flex:1;resize:none;min-height:44px;max-height:140px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:10px}
.side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.side select,.side input[type=text],.side input:not([type]){width:100%}
.chat{display:flex;flex-direction:column;gap:8px;min-height:0}
.chat #log{flex:1;min-height:0}
@media (max-width:820px){
  main{height:auto;min-height:100%}
  .app{grid-template-columns:1fr;flex:none}
  .side{overflow:visible}.tw{flex:none;max-height:240px}
  .chat{min-height:420px}
}
</style>
</head>
<body>
<main>
  <h1>浏览器本地 AI <small style="color:var(--mu);font-weight:400">模型直接下载到你的浏览器运行，不经过任何服务器</small></h1>
  <div class="app">
    <aside class="card side">
      <div><label>引擎</label>
        <select id="eng">
          <option value="webllm">WebLLM（WebGPU，聊天首选）</option>
          <option value="tjs">Transformers.js（ONNX，GPU/CPU 回退）</option>
        </select></div>
      <div><label>搜索模型</label>
        <div class="row" style="flex-wrap:nowrap">
          <input id="q" style="flex:1" placeholder="如 qwen / llama / gemma">
          <span id="hfRow" style="display:none"><button id="hfs">联网搜索 HF</button></span>
        </div></div>
      <div class="tw"><table><thead><tr><th>模型（点击一行选中）</th><th>信息</th></tr></thead><tbody id="tb"></tbody></table></div>
      <div id="cnt" style="font-size:12px;color:var(--mu)"></div>
      <div id="customRow" style="display:none"><label>自定义 Hugging Face 模型 ID（需为 ONNX 格式，留空则用上方选择）</label>
        <input id="custom" placeholder="onnx-community/xxx"></div>
      <label><input type="checkbox" id="mir"> 使用 HF 镜像（hf-mirror.com，国内推荐）</label>
      <div class="row">
        <button class="p" id="load" style="flex:1">下载并加载</button>
        <button id="unload" disabled>卸载</button>
      </div>
      <div id="pick" style="font-size:12px;word-break:break-all"></div>
      <div class="bar" style="margin-top:0"><i id="bar"></i></div>
      <div id="st" style="margin-top:0">未加载模型</div>
      <details id="dg" style="display:none"><summary style="cursor:pointer;font-size:12px">诊断信息（失败时点开，全选复制）</summary><pre id="dgp" style="white-space:pre-wrap;user-select:all;font-size:12px;margin:6px 0 0"></pre></details>
      <div id="env" style="font-size:12px;color:var(--mu)"></div>
    </aside>
    <section class="chat">
      <div class="card" id="log"></div>
      <div class="row" style="flex-wrap:nowrap">
        <textarea id="in" placeholder="先加载模型，再输入内容（Enter 发送，Shift+Enter 换行）" disabled></textarea>
        <button class="p" id="send" disabled>发送</button><button id="stop" disabled>停止</button><button id="clr">清空</button>
      </div>
    </section>
  </div>
</main>

<script type="module">
// ===== 纯逻辑（可在 Node 中单测）=====
const WEBLLM_URLS = [
  "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm",
  "https://esm.sh/@mlc-ai/web-llm@0.2.79",
  "https://esm.run/@mlc-ai/web-llm@0.2.85",
  "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm",
  "https://esm.sh/@mlc-ai/web-llm",
];
const TJS_URLS = [
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2",
  "https://esm.sh/@huggingface/transformers@3.7.2",
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0",
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers",
  "https://esm.sh/@huggingface/transformers",
];
const MIRROR = "https://hf-mirror.com";
async function importFirst(urls, importer, ms = 20000) {
  const errs = [];
  for (const u of urls) {
    try {
      const mod = await Promise.race([importer(u), new Promise((_, rj) => setTimeout(() => rj(new Error("超时")), ms))]);
      return { mod, url: u };
    } catch (e) { errs.push(u + " → " + (e && e.message || e)); }
  }
  const err = new Error("所有 CDN 均加载失败：\n" + errs.join("\n")); err.attempts = errs; throw err;
}
function mirrorConfig(cfg, on) {
  if (!on || !cfg || !Array.isArray(cfg.model_list)) return cfg;
  return { ...cfg, model_list: cfg.model_list.map(m => ({ ...m, model: String(m.model).replace(/^https:\/\/huggingface\.co/, MIRROR) })) };
}
const TJS_MODELS = [
  { id: "onnx-community/Qwen2.5-0.5B-Instruct", note: "约 0.5B" },
  { id: "onnx-community/Qwen2.5-1.5B-Instruct", note: "约 1.5B" },
  { id: "onnx-community/Qwen3-0.6B-ONNX", note: "约 0.6B" },
  { id: "onnx-community/SmolLM2-360M-Instruct", note: "约 0.36B，最小" },
  { id: "onnx-community/gemma-3-1b-it-ONNX", note: "约 1B" },
];
function filterModels(list, q) {
  if (!Array.isArray(list)) return [];
  const k = String(q ?? "").trim().toLowerCase();
  return k ? list.filter(m => m.id.toLowerCase().includes(k)) : list.slice();
}
function resolveModelId(selected, custom, engine) {
  const c = String(custom ?? "").trim();
  if (engine === "tjs" && c) {
    if (!/^[\w.-]+\/[\w.-]+$/.test(c)) throw new Error("模型 ID 格式应为 作者/模型名");
    return c;
  }
  if (!selected) throw new Error("请先选择模型");
  return selected;
}
function pickDevice(hasGpu) { return hasGpu ? { device: "webgpu", dtype: "q4f16" } : { device: "wasm", dtype: "q8" }; }
function clamp01(x) { x = Number(x); return Number.isFinite(x) ? Math.min(1, Math.max(0, x)) : 0; }
function buildMessages(history, sys) { return [{ role: "system", content: sys }, ...history]; }
function fmtNum(n) { n = Number(n); if (!Number.isFinite(n)) return "?"; return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n); }
function parseHfModels(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.filter(x => x && typeof x.id === "string" && x.id.includes("/"))
    .map(x => ({ id: x.id, note: "下载 " + fmtNum(x.downloads) }));
}
function dtypeChain(hasGpu) {
  return hasGpu
    ? [{ device: "webgpu", dtype: "q4f16" }, { device: "webgpu", dtype: "q4" }, { device: "webgpu", dtype: "fp16" }, { device: "wasm", dtype: "q8" }, { device: "wasm", dtype: "q4" }]
    : [{ device: "wasm", dtype: "q8" }, { device: "wasm", dtype: "q4" }, { device: "wasm", dtype: "fp32" }];
}
function describeThrown(e, d = 0) {
  if (e == null) return String(e);
  if (typeof e !== "object") return String(e);
  const parts = [], cn = (e.constructor && e.constructor.name) || "Object";
  parts.push("类型=" + cn);
  if (e.name && e.name !== cn) parts.push("name=" + e.name);
  if (e.message) parts.push("message=" + e.message);
  if (e.type) parts.push("type=" + e.type);
  let names = []; try { names = Object.getOwnPropertyNames(e); } catch (_) {}
  for (const k of names) {
    if (k === "stack" || k === "message" || k === "name" || k === "type") continue;
    try { const v = e[k]; if (v != null && typeof v !== "object" && typeof v !== "function") parts.push(k + "=" + String(v)); } catch (_) {}
  }
  let inner = null; try { inner = e.error || e.reason || (e.target && e.target.error); } catch (_) {}
  if (inner && inner !== e && d < 2) parts.push("内层{" + describeThrown(inner, d + 1) + "}");
  try { const s = String(e); if (s && !s.startsWith("[object")) parts.push("str=" + s); } catch (_) {}
  return parts.join("; ");
}
async function probeEnv() {
  const r = { proto: typeof location !== "undefined" ? location.protocol : "?", secure: typeof isSecureContext !== "undefined" ? isSecureContext : null,
    ios: /iPad|iPhone|iPod/.test((typeof navigator !== "undefined" && navigator.userAgent) || ""), cache: false, idb: false, adapter: false, f16: false, maxBuf: null };
  r.sandbox = r.proto === "about:" || r.proto === "file:";
  try { if (typeof caches !== "undefined") { await caches.open("__probe"); await caches.delete("__probe"); r.cache = true; } } catch (_) {}
  try {
    r.idb = await new Promise(res => { const q = indexedDB.open("__probe"); q.onsuccess = () => { try { q.result.close(); indexedDB.deleteDatabase("__probe"); } catch (_) {} res(true); }; q.onerror = () => res(false); q.onblocked = () => res(false); setTimeout(() => res(false), 3000); });
  } catch (_) {}
  try {
    const ad = typeof navigator !== "undefined" && navigator.gpu ? await navigator.gpu.requestAdapter() : null;
    if (ad) { r.adapter = true; r.f16 = !!(ad.features && ad.features.has && ad.features.has("shader-f16")); r.maxBuf = (ad.limits && ad.limits.maxBufferSize) || null; }
  } catch (_) {}
  return r;
}
function envSummary(r) {
  return "协议=" + r.proto + " 安全上下文=" + r.secure + " iOS=" + r.ios + " Cache=" + (r.cache ? "✓" : "✗") + " IndexedDB=" + (r.idb ? "✓" : "✗") +
    " GPU适配器=" + (r.adapter ? "✓" : "✗") + " shader-f16=" + (r.f16 ? "✓" : "✗") + (r.maxBuf ? " maxBuffer=" + Math.round(r.maxBuf / 1048576) + "MB" : "");
}
function modelCompat(m, env) {
  if (env && env.adapter && !env.f16 && /f16/i.test(m.id)) return { ok: false, why: "需要 shader-f16，本设备不支持" };
  if (env && env.ios && m.vram > 1500) return { ok: false, why: "iPad/iPhone 内存可能放不下" };
  return { ok: true, why: "" };
}
function explainError(e, ctx) {
  let raw = e instanceof Error ? (e.message || e.name) : (e && typeof e === "object" ? (e.message || describeThrown(e)) : String(e));
  if (!raw || raw === "undefined") raw = "未知错误（无详细信息）";
  const T = (kind, hint) => ({ kind, msg: raw, hint });
  if (/Cannot find model record/i.test(raw)) return T("record", "模型 ID 不在当前库的内置列表里，请从表格中重新选择。");
  if (/WebGPU|adapter|GPUDevice|device (was )?lost|navigator\.gpu/i.test(raw)) return T("gpu", "WebGPU 不可用或被中断：请用最新版 Chrome/Edge，页面需是 HTTPS 或 localhost；也可改用 Transformers.js（CPU）。");
  if ((e && e.name === "RangeError") || /^\s*\d+\s*$/.test(raw) || /out of memory|allocation|buffer size|maxBufferSize|memory access/i.test(raw) || /\bOOM\b/.test(raw)) return T("mem", "内存/显存不足：换更小的模型（如 SmolLM2-360M、Qwen2.5-0.5B），并关闭其它占内存的标签页。");
  if (/Cache|SecurityError|QuotaExceeded|opaque|IndexedDB|storage/i.test(raw)) return T("storage", "浏览器存储不可用：不要用 file:// 双击打开，也不要用无痕模式；请用 GitHub Pages 或本地 http 服务打开，并确认磁盘空间足够。");
  if (/Failed to fetch|NetworkError|Load failed|ERR_|timeout|超时/i.test(raw)) return T("net", "网络问题：勾选「HF 镜像」重试；WebLLM 还需访问 GitHub raw，必要时开代理。");
  if (/404|Could not locate|not found|401|403|gated|Unauthorized/i.test(raw)) return T("notfound", "该仓库没有浏览器可用的 ONNX 文件，或需要登录授权：请换一个模型。");
  if (/Unsupported model type|not supported|unsupported/i.test(raw)) return T("unsupported", "当前库版本不支持这个模型架构：换一个模型。");
  if (ctx && ctx.sandbox) return T("other", "页面运行在内嵌/沙盒环境（协议 " + ctx.proto + "），浏览器存储常被禁用：请把页面部署到 GitHub Pages，然后在 Safari/Chrome 地址栏里直接打开。");
  if (ctx && ctx.ios) return T("other", "iPad/iPhone 内存限制很严：换 SmolLM2-360M 或 Qwen2.5-0.5B 的 q4f32 模型试试。");
  return T("other", "");
}
function safeJson(o) { try { return JSON.stringify(o); } catch (_) { return String(o); } }
globalThis.__lib = { describeThrown, probeEnv, envSummary, modelCompat, dtypeChain, explainError, fmtNum, parseHfModels, importFirst, mirrorConfig, filterModels, resolveModelId, pickDevice, clamp01, buildMessages, TJS_MODELS };

// ===== 界面与引擎 =====
if (typeof document !== "undefined") {
  const $ = id => document.getElementById(id);
  const SYS = "你是一个乐于助人的助手，默认使用用户的语言回答。";
  const S = { sel: "", remoteQ: null, libs: {}, kind: null, eng: null, pipe: null, stopper: null, tjs: null, busy: false, hist: [], models: [] };
  let importer = u => import(u);
  globalThis.__lib.setImporter = f => { importer = f; };
  const hasGpu = !!navigator.gpu;
  
  const envLabel = () => { $("env").textContent = (hasGpu ? "WebGPU：可用" : "WebGPU：不可用（仅 Transformers.js 的 CPU 模式可用）") +
    (S.env && S.env.sandbox ? "；⚠ 页面在 " + S.env.proto + " 环境运行，浏览器存储可能不可用，请部署到 GitHub Pages 后直接打开" : "") +
    (S.env && S.env.ios && S.env.adapter && !S.env.f16 ? "；本设备无 shader-f16，已将 f16 模型标为不兼容" : ""); };
  envLabel();
  function diag(e, id, kind) {
    $("dgp").textContent = ["模型: " + id, "引擎: " + kind, "WebGPU: " + hasGpu, "HF镜像: " + $("mir").checked, "环境: " + (S.env ? envSummary(S.env) : "未探测"),
      "UA: " + (navigator.userAgent || "?"), "错误详情: " + describeThrown(e), "堆栈: " + ((e && e.stack) || "无")].join("\n");
    $("dg").style.display = "block";
  }

  async function getLib(name, urls) {
    if (S.libs[name]) return S.libs[name];
    status("正在加载 " + name + " 库…（依次尝试多个 CDN）");
    const r = await importFirst(urls, u => importer(u));
    S.libs[name] = r.mod; status(name + " 库已加载：" + r.url, "ok"); return r.mod;
  }
  const status = (t, c = "") => { $("st").textContent = t; $("st").className = c; };
  const bar = p => { $("bar").style.width = (clamp01(p) * 100).toFixed(1) + "%"; };

  function fillSelect() {
    const q = $("q").value;
    const list = (S.remoteQ !== null && q.trim() === S.remoteQ) ? S.models : filterModels(S.models, q);
    const shown = list.slice(0, 300);
    if (!shown.some(m => m.id === S.sel)) S.sel = shown[0] ? shown[0].id : "";
    const tb = $("tb"); tb.innerHTML = "";
    for (const m of shown) {
      const tr = document.createElement("tr"); if (m.id === S.sel) tr.className = "sel";
      if (m.bad) tr.style.opacity = ".55";
      const a = document.createElement("td"); a.textContent = m.id;
      const b = document.createElement("td"); b.textContent = m.note || "";
      tr.append(a, b);
      tr.onclick = () => { S.sel = m.id; for (const r of tb.children) r.classList.remove("sel"); tr.classList.add("sel"); $("pick").textContent = "已选：" + m.id; };
      tb.appendChild(tr);
    }
    $("pick").textContent = S.sel ? "已选：" + S.sel : "";
    $("cnt").textContent = "共 " + S.models.length + " 个，符合 " + list.length + " 个" + (list.length > 300 ? "（仅显示前 300，请缩小搜索）" : "");
  }
  async function searchHf() {
    const q = $("q").value.trim();
    const host = $("mir").checked ? MIRROR : "https://huggingface.co";
    const url = host + "/api/models?library=transformers.js&pipeline_tag=text-generation&sort=downloads&direction=-1&limit=50" + (q ? "&search=" + encodeURIComponent(q) : "");
    status("联网搜索中…"); $("hfs").disabled = true;
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
      const r = await fetch(url, { signal: ctl.signal }); clearTimeout(t);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const list = parseHfModels(await r.json());
      if (!list.length) { status("没有搜到结果，换个关键词试试", "er"); }
      else { S.models = list; S.remoteQ = q; fillSelect(); status("联网搜到 " + list.length + " 个 ONNX 文本生成模型（按下载量排序）", "ok"); }
    } catch (e) { status("联网搜索失败：" + (e.name === "AbortError" ? "超时" : e.message) + "（可勾选 HF 镜像再试）", "er"); }
    $("hfs").disabled = false;
  }
  async function loadList() {
    const eng = $("eng").value; S.remoteQ = null;
    if (!S.env && S.envP) S.env = await S.envP;
    $("customRow").style.display = eng === "tjs" ? "flex" : "none";
    $("hfRow").style.display = eng === "tjs" ? "block" : "none";
    if (eng === "tjs") { S.models = TJS_MODELS; fillSelect(); return; }
    status("正在获取 WebLLM 模型列表…");
    try {
      const w = await getLib("webllm", WEBLLM_URLS);
      S.models = w.prebuiltAppConfig.model_list.map(m => {
        const c = modelCompat({ id: m.model_id, vram: m.vram_required_MB }, S.env);
        return { id: m.model_id, bad: !c.ok, note: (m.vram_required_MB ? "显存约 " + Math.round(m.vram_required_MB) + " MB" : "") + (c.ok ? "" : "  ⚠ " + c.why) };
      }).sort((x, y) => (x.bad ? 1 : 0) - (y.bad ? 1 : 0));
      fillSelect(); status("共 " + S.models.length + " 个 WebLLM 模型可选", "ok");
    } catch (e) { S.models = []; fillSelect(); status("获取模型列表失败：" + e.message, "er"); $("st").style.whiteSpace = "pre-wrap"; }
  }
  function add(role, text) {
    const d = document.createElement("div"); d.className = "m " + role; d.textContent = text;
    $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight; return d;
  }
  function ui(loaded) {
    $("in").disabled = $("send").disabled = !loaded; $("unload").disabled = !loaded;
    $("load").disabled = S.busy;
  }
  async function unload() {
    try { if (S.kind === "webllm" && S.eng) await S.eng.unload(); if (S.kind === "tjs" && S.pipe) await S.pipe.dispose?.(); } catch (_) {}
    S.kind = S.eng = S.pipe = null; S.hist = []; bar(0); status("已卸载"); ui(false);
  }
  async function load() {
    let id;
    try { id = resolveModelId(S.sel, $("custom").value, $("eng").value); } catch (e) { status(e.message, "er"); return; }
    const kind = $("eng").value;
    if (kind === "webllm" && !hasGpu) { status("当前浏览器无 WebGPU，请改用 Transformers.js 或换 Chrome/Edge（需 HTTPS 或 localhost）", "er"); return; }
    S.busy = true; ui(false); await unload(); S.busy = true; $("load").disabled = true; bar(0);
    try {
      let used = "";
      if (kind === "webllm") {
        const w = await getLib("webllm", WEBLLM_URLS);
        const env = S.env = await probeEnv(); envLabel();
        if (!env.adapter) throw new Error("WebGPU adapter 获取失败（显卡/驱动不支持）");
        if (!env.cache && !env.idb) throw new Error("浏览器存储不可用（Cache API 与 IndexedDB 都被禁用），无法缓存模型文件。协议：" + env.proto);
        const cfg = mirrorConfig(w.prebuiltAppConfig, $("mir").checked);
        const appConfig = env.cache ? cfg : { ...cfg, useIndexedDBCache: true };
        S.eng = await w.CreateMLCEngine(id, { appConfig, initProgressCallback: r => { bar(r.progress); status(r.text); } });
      } else {
        S.tjs = await getLib("transformers.js", TJS_URLS);
        try { S.tjs.env.remoteHost = ($("mir").checked ? MIRROR : "https://huggingface.co") + "/"; } catch (_) {}
        let lastErr = null;
        for (const c of dtypeChain(hasGpu)) {
          try {
            status("尝试 " + c.device + " / " + c.dtype + " …");
            S.pipe = await S.tjs.pipeline("text-generation", id, {
              device: c.device, dtype: c.dtype,
              progress_callback: p => { if (p.status === "progress") { bar(p.progress / 100); status("[" + c.device + "/" + c.dtype + "] 下载 " + (p.file || "") + " " + Math.round(p.progress) + "%"); } }
            });
            used = " （" + c.device + " / " + c.dtype + "）"; lastErr = null; break;
          } catch (e) { lastErr = e; S.pipe = null; if (explainError(e).kind === "mem") break; }
        }
        if (lastErr) throw lastErr;
      }
      S.kind = kind; bar(1); status("已加载：" + id + used, "ok"); $("dg").style.display = "none"; ui(true); $("in").focus();
    } catch (e) {
      const x = explainError(e, S.env); S.kind = S.eng = S.pipe = null; bar(0);
      status("加载失败：" + x.msg + (x.hint ? "\n💡 " + x.hint : ""), "er"); diag(e, id, kind); ui(false);
    }
    S.busy = false; $("load").disabled = false;
  }
  async function send() {
    const text = $("in").value.trim(); if (!text || !S.kind || S.busy) return;
    $("in").value = ""; S.busy = true; $("send").disabled = true; $("stop").disabled = false;
    S.hist.push({ role: "user", content: text }); add("user", text);
    const out = add("assistant", "…"); let acc = "";
    try {
      const msgs = buildMessages(S.hist, SYS);
      if (S.kind === "webllm") {
        const it = await S.eng.chat.completions.create({ messages: msgs, stream: true, temperature: 0.7 });
        for await (const ch of it) { acc += ch.choices[0]?.delta?.content || ""; out.textContent = acc || "…"; $("log").scrollTop = 1e9; }
      } else {
        S.stopper = new S.tjs.InterruptableStoppingCriteria();
        const streamer = new S.tjs.TextStreamer(S.pipe.tokenizer, { skip_prompt: true, skip_special_tokens: true,
          callback_function: t => { acc += t; out.textContent = acc; $("log").scrollTop = 1e9; } });
        await S.pipe(msgs, { max_new_tokens: 512, do_sample: true, temperature: 0.7, streamer, stopping_criteria: S.stopper });
      }
      S.hist.push({ role: "assistant", content: acc });
    } catch (e) { out.textContent = (acc ? acc + "\n" : "") + "[出错] " + (e.message || e); S.hist.pop(); }
    S.busy = false; $("send").disabled = false; $("stop").disabled = true;
  }
  $("eng").onchange = async () => { await unload(); await loadList(); };
  $("q").oninput = fillSelect; $("hfs").onclick = searchHf;
  $("q").onkeydown = e => { if (e.key === "Enter" && $("eng").value === "tjs") searchHf(); };
  $("load").onclick = load; $("unload").onclick = unload; $("send").onclick = send;
  $("stop").onclick = () => { try { S.kind === "webllm" ? S.eng?.interruptGenerate() : S.stopper?.interrupt(); } catch (_) {} };
  $("clr").onclick = () => { S.hist = []; $("log").innerHTML = ""; };
  $("in").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } };
  S.envP = probeEnv().catch(() => null);
  (async () => { S.env = await S.envP; envLabel(); await loadList(); })();
}
</script>
